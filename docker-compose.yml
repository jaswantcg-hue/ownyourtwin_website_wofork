version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auraai-app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - auranet
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 5173

networks:
  auranet:
    driver: bridge
