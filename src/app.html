<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OwnYourTwin</title>
    <meta
      name="description"
      content="OwnYourTwin - Own Your Data, Earn From It. Create an AI-powered Digital Twin that reflects your behaviors and values. Businesses get ethical consumer insights. You stay in control."
    />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
 <body data-sveltekit-preload-data="hover" class="bg-void-950 text-white">
  <div style="display: contents">%sveltekit.body%</div>

  <button id="myBtn" onclick="getLocation()">Get Location</button> 
  <p id="output"></p> 
  <script>
    function getLocation() { 
      if (navigator.geolocation) { 
        navigator.geolocation.getCurrentPosition(showPosition, showError); 
      } else { 
        document.getElementById("output").innerHTML = "Geolocation not supported."; 
      } 
    } 

    function showPosition(position) { 
      document.getElementById("output").innerHTML = 
        "Latitude: " + position.coords.latitude + 
        "<br>Longitude: " + position.coords.longitude; 
    } 

    function showError(error) { 
      document.getElementById("output").innerHTML = "Error: " + error.message; 
    } 

    // Run automatically when the page loads
    window.onload = getLocation;
  </script>
</body>
</html>
