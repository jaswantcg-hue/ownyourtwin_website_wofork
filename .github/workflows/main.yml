name: Build and Deploy to Azure

on:
  push:
    branches:
      - deploy
      - main
      - remotes/origin/Sonal_V1
      - new_calm_design
  pull_request:
    branches:
      - deploy
      - main
      - remotes/origin/Sonal_V1
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build SvelteKit app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          # app-name and publish-profile are stored in the repository's
          # GitHub Secrets. Never hardcode credentials or keys directly in
          # this workflow; doing so exposes them to anyone who can read the
          # repository history. Set them under Settings ➜ Secrets & variables
          # ➜ Actions before running the workflow.
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
