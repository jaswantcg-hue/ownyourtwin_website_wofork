name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main
      - master
      - develop
      - remotes/origin/Sonal_V1 
      - Sonal_V1
  pull_request:
    branches:
      - main
      - master
      - remotes/origin/Sonal_V1
      - Sonal_V1

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build SvelteKit Application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Create deployment package
        run: |
          # Ensure a dist folder exists with the Node server output (Azure expects /home/site/wwwroot/dist)
          rm -rf dist || true
          mkdir -p dist
          # Copy the adapter-node server output into dist
          if [ -d ".svelte-kit/output/server" ]; then
            cp -r .svelte-kit/output/server/* dist/
          else
            echo "Warning: .svelte-kit/output/server not found"
          fi
          # Include node_modules and package manifests so Azure can run the Node server
          cp -r node_modules dist/node_modules
          cp package.json package-lock.json dist/
          # Zip the dist folder for deployment
          cd dist && zip -r ../release.zip . && cd ..
      
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
